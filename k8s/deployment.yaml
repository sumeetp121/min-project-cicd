apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-cicd-app
  template:
    metadata:
      labels:
        app: mini-cicd-app
    spec:
      containers:
        - name: mini-cicd-app
          image: sumeetp121/mini-cicd-app:v1
          ports:
            - containerPort: 80